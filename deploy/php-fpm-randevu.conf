; Randevu — ayrı PHP-FPM havuzu (varsayılan 'www' havuzundan izole)
; Kurulum: /etc/php/8.3/fpm/pool.d/randevu.conf olarak kopyala, fpm reload.
[randevu]
user = www-data
group = www-data

listen = /run/php/randevu-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Ayrı log (diğer uygulama loglarından bağımsız)
php_admin_value[error_log] = /var/www/randevu/storage/logs/php-fpm.error.log
php_admin_flag[log_errors] = on
catch_workers_output = yes

php_admin_value[date.timezone] = Europe/Istanbul
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 4M
