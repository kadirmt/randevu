# =========================================================
# Randevu — Nginx vhost (izole vhost)
# Test: 8091 portunda dinler; cloudflared quick tunnel buraya bağlanır.
# Mevcut default vhost'a dokunmaz.
# Kurulum: /etc/nginx/sites-available/randevu -> sites-enabled symlink, reload.
# =========================================================
server {
    listen 8091;
    listen [::]:8091;
    server_name _;

    root /var/www/randevu/public;
    index index.php;

    client_max_body_size 4m;
    charset utf-8;

    access_log /var/log/nginx/randevu.access.log;
    error_log  /var/log/nginx/randevu.error.log warn;

    # Gizli dosyalar / config
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(config\.php|config\.example\.php)$ { deny all; }

    # Statik assetler — uzun cache
    location ~* ^/assets/.+\.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler — RANDEVU'ya özel socket
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/randevu-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
    }
}
